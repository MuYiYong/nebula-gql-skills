name: Validate and Package Nebula Skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Package version without v prefix (e.g. 26.10.23)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-$(date -u +%y.%m.%d)}"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]] || { echo 'Invalid version'; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}_Build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Audit, regressions, package and isolated distribution validation
        run: python scripts/check_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-skills-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/eval-fixtures.json
          if-no-files-found: error

  release:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-skills-${{ github.run_id }}
          path: dist
      - name: Publish only validated archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
