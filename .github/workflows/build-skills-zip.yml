name: Build Nebula Skills Zip

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Package version without v prefix (e.g. 26.07.13)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-skills-zip.yml"
      - "src/**"
      - "scripts/**"
      - "README.md"
      - "README.zh-CN.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve package version
        shell: bash
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            release_version="${{ inputs.release_version }}"
          else
            release_version="$(date -u +%y.%m.%d)"
          fi
          build_code="$(TZ=Asia/Shanghai date +%H%M)"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_CODE=${build_code}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${release_version}_Build${build_code}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=v${release_version} Build${build_code}" >> "$GITHUB_ENV"

      - name: Build zip packages
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: python scripts/package_core_skills.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-skills-zips-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
